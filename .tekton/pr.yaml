# Pipelines-as-Code: the PR check "titanro-ci / pr" on pull requests to master, three tasks in parallel:
# - image: build Dockerfile.titanro WITHOUT pushing it and scan it with Trivy against the image deployed now (pinned in
#   TitanRO/sysops argo/prod-season/robrowser). Fails on a build error or on a NEW fixable HIGH/CRITICAL vulnerability.
# - tests: vitest. lint: ESLint and the Prettier check, both always run (Task run-check in TitanRO/sysops: the PR
#   code runs with no credentials). The pre-commit hook (lint-staged, installed by npm install) applies the same
#   fixes on commit.
# Same-repo PRs (incl. Renovate) run automatically; fork PRs need /ok-to-test.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
    name: pr
    annotations:
        pipelinesascode.tekton.dev/on-event: '[pull_request]'
        pipelinesascode.tekton.dev/on-target-branch: '[master]'
        pipelinesascode.tekton.dev/max-keep-runs: '5'
        # A new push to the PR cancels the check still running for its previous commit.
        pipelinesascode.tekton.dev/cancel-in-progress: 'true'
spec:
    params:
        - { name: git-url, value: '{{ repo_url }}' }
        - { name: git-revision, value: '{{ revision }}' }
    pipelineSpec:
        params:
            - name: git-url
            - name: git-revision
        workspaces:
            - name: github-app
            - name: docr-pull
        tasks:
            - name: image
              taskRef:
                  resolver: cluster
                  params:
                      - { name: kind, value: task }
                      - { name: name, value: build-check }
                      - { name: namespace, value: tekton-pipelines }
              params:
                  - { name: git-url, value: $(params.git-url) }
                  - { name: git-revision, value: $(params.git-revision) }
                  - { name: context, value: . }
                  - { name: dockerfile, value: Dockerfile.titanro }
                  - { name: image-name, value: robrowser }
                  - { name: sysops-path, value: argo/prod-season/robrowser }
              workspaces:
                  - { name: github-app, workspace: github-app }
                  - { name: dockerconfig, workspace: docr-pull }
            - name: tests
              taskRef:
                  resolver: cluster
                  params:
                      - { name: kind, value: task }
                      - { name: name, value: run-check }
                      - { name: namespace, value: tekton-pipelines }
              params:
                  - { name: git-url, value: $(params.git-url) }
                  - { name: git-revision, value: $(params.git-revision) }
                  - { name: image, value: 'node:24.22.2-alpine3.24' }
                  # Four vitest workers (about 1.3 GiB at peak): one per host CPU would exceed the task's 2 GiB memory limit.
                  - name: script
                    value: |
                        npm ci --no-audit --no-fund
                        npx vitest run --maxWorkers=4
              workspaces:
                  - { name: github-app, workspace: github-app }
            - name: lint
              taskRef:
                  resolver: cluster
                  params:
                      - { name: kind, value: task }
                      - { name: name, value: run-check }
                      - { name: namespace, value: tekton-pipelines }
              params:
                  - { name: git-url, value: $(params.git-url) }
                  - { name: git-revision, value: $(params.git-revision) }
                  - { name: image, value: 'node:24.22.2-alpine3.24' }
                  - name: script
                    value: |
                        npm ci --no-audit --no-fund
                        status=0
                        npm run lint || status=1
                        npm run format:check || { echo "Run 'npm run format' to fix."; status=1; }
                        exit $status
              workspaces:
                  - { name: github-app, workspace: github-app }
    # Lint needs little CPU. The tests get their own request: four vitest workers (jsdom, about 1.3 GiB at peak) on
    # run-check's default 250m CPU were starved whenever other checks shared the node, and a different test timed out
    # on each run (5-10 s test and hook timeouts, a 600-700 s suite).
    taskRunSpecs:
        - pipelineTaskName: tests
          stepSpecs:
              - name: run
                computeResources:
                    requests: { cpu: '2', memory: 1536Mi }
                    limits: { memory: 2Gi }
        - pipelineTaskName: lint
          stepSpecs:
              - name: run
                computeResources:
                    requests: { cpu: 500m, memory: 512Mi }
                    limits: { memory: 2Gi }
    taskRunTemplate:
        serviceAccountName: ci-builder
        podTemplate:
            securityContext:
                fsGroup: 65532
    timeouts:
        pipeline: 60m
    workspaces:
        - name: github-app
          secret:
              secretName: ci-github-app
        - name: docr-pull
          secret:
              secretName: ci-docr-push
              items:
                  - { key: docker_auth_config, path: config.json }
