<title>TitanRO WoE Still</title>
<link rel="stylesheet" href="site.css">
<script>
// Castle stills open in the game's web build (/game/?view=woe&id=N); this address stays for links made before.
(function () {
	'use strict';
	var id = new URLSearchParams(location.search).get('id');
	location.replace('game/?view=woe' + (id ? '&id=' + encodeURIComponent(id) : ''));
})();
</script>
</head>
<body>
<main>
	<p class="muted">Castle stills open in the game: <a href="game/?view=woe">continue</a>, or go back to the
		<a href="woe.html">WoE tracker</a>.</p>
</main>
</body>
